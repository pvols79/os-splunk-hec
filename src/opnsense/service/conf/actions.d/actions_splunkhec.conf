[restart]
command:/usr/local/sbin/pluginctl -s splunk_hec restart
parameters:
type:script
message:Restarting Splunk HEC exporter

[start]
command:/usr/local/sbin/pluginctl -s splunk_hec start
parameters:
type:script
message:Starting Splunk HEC exporter

[stop]
command:/usr/local/sbin/pluginctl -s splunk_hec stop
parameters:
type:script
message:Stopping Splunk HEC exporter

[status]
command:/usr/local/sbin/pluginctl -s splunk_hec status
parameters:
type:script_output
message:Requesting Splunk HEC exporter status
